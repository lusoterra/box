<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>box</title>
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efc79c"/>
      <stop offset="1" stop-color="#e2b184"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcae82"/>
      <stop offset="1" stop-color="#cf9b70"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d2a076"/>
      <stop offset="1" stop-color="#c28d63"/>
    </linearGradient>
  </defs>
  <!-- taller / narrower isometric carton -->
  <g stroke="#3a3a3a" stroke-width="22" stroke-linejoin="round" stroke-linecap="round">
    <path d="M256 52 430 172 256 292 82 172Z" fill="url(#top)"/>
    <path d="M82 172 256 292 256 492 82 372Z" fill="url(#left)"/>
    <path d="M430 172 256 292 256 492 430 372Z" fill="url(#right)"/>
    <!-- lid seam: lighter than the outline, darker than the carton -->
    <path d="M168 122 344 230" fill="none" stroke="#6f5741"
          stroke-width="15" opacity=".55"/>
  </g>
  <!-- "this way up": two arrows on the left face, no text -->
  <g fill="none" stroke="#3a3a3a" stroke-width="13" opacity=".72"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M142 392V316"/>
    <path d="M124 334 142 316 160 334"/>
    <path d="M198 392V316"/>
    <path d="M180 334 198 316 216 334"/>
  </g>
  <!-- ^^ cat ears on the right face, no text -->
  <g fill="none" stroke="#3a3a3a" stroke-width="14" opacity=".8"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M302 372 322 346 342 372"/>
    <path d="M358 372 378 346 398 372"/>
  </g>
</svg>
