<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>box</title>
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efc79c"/>
      <stop offset="1" stop-color="#e2b184"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcae82"/>
      <stop offset="1" stop-color="#cf9b70"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d2a076"/>
      <stop offset="1" stop-color="#c28d63"/>
    </linearGradient>
  </defs>

  <!-- keep the carton centered with an even margin on all sides -->
  <g transform="translate(256 256) scale(0.94) translate(-256 -272)">
    <!-- taller / narrower isometric carton -->
    <g>
      <path d="M256 52 430 172 256 292 82 172Z" fill="url(#top)"/>
      <path d="M82 172 256 292 256 492 82 372Z" fill="url(#left)"/>
      <path d="M430 172 256 292 256 492 430 372Z" fill="url(#right)"/>
    </g>

    <!-- lid seam: edge-to-edge on the top face (parallel to the top-right
         edge) and painted before the border, which hides both ends -->
    <path d="M182 104 356 224" fill="none" stroke="#6f5741"
          stroke-width="14" opacity=".55"/>

    <g fill="none" stroke="#3a3a3a" stroke-width="22"
       stroke-linejoin="round" stroke-linecap="round">
      <path d="M256 52 430 172 256 292 82 172Z"/>
      <path d="M82 172 256 292 256 492 82 372Z"/>
      <path d="M430 172 256 292 256 492 430 372Z"/>
    </g>
  </g>
</svg>
